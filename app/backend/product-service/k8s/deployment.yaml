apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: novocart
  labels:
    app: product-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        version: v1
    spec:
      containers:
      - name: product-service
        image: 271376211486.dkr.ecr.eu-west-1.amazonaws.com/product-service:latest
        ports:
        - containerPort: 8082
