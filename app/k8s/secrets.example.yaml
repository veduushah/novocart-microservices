# Copy to secrets.yaml, fill in real values, then apply:
#   cp secrets.example.yaml secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Do NOT commit secrets.yaml — it is listed in .gitignore
apiVersion: v1
kind: Secret
metadata:
  name: cloudblitz-secrets
  namespace: cloudblitz
type: Opaque
stringData:
  MONGO_USER: "<mongodb-username>"
  MONGO_URI_AUTH: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/cb_auth?retryWrites=true&w=majority"
  MONGO_URI_COURSE: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/cb_courses?retryWrites=true&w=majority"
  MONGO_URI_ENROLLMENT: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/cb_enrollments?retryWrites=true&w=majority"
  JWT_SECRET: "<generate-a-strong-random-secret>"
