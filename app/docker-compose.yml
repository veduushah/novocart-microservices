services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: novocart-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongo_data:/data/db
    networks:
      - novocart-network

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: novocart-auth-service
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongo:27017/novocart_auth?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SERVER_PORT: 8081
    depends_on:
      - mongo
    networks:
      - novocart-network

  # Product Service
  product-service:
    build:
      context: ./backend/product-service
      dockerfile: Dockerfile
    container_name: novocart-product-service
    ports:
      - "8082:8082"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongo:27017/novocart_products?authSource=admin
      SERVER_PORT: 8082
    depends_on:
      - mongo
    networks:
      - novocart-network

  # Order Service
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: novocart-order-service
    ports:
      - "8083:8083"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongo:27017/novocart_orders?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SERVER_PORT: 8083
    depends_on:
      - mongo
    networks:
      - novocart-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API: http://localhost:8081/api/auth
        VITE_PRODUCT_API: http://localhost:8082/api/products
        VITE_ORDER_API: http://localhost:8083/api/orders
    container_name: novocart-frontend
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
      - product-service
      - order-service
    networks:
      - novocart-network

volumes:
  mongo_data:

networks:
  novocart-network:
    driver: bridge
