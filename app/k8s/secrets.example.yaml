# Copy to secrets.yaml, fill in real values, then apply:
#   cp secrets.example.yaml secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Do NOT commit secrets.yaml — it is listed in .gitignore
apiVersion: v1
kind: Secret
metadata:
  name: novocart-secrets
  namespace: novocart
type: Opaque
stringData:
  MONGO_USER: "<mongodb-username>"
  MONGO_URI_AUTH: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/novocart_auth?retryWrites=true&w=majority"
  MONGO_URI_PRODUCT: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/novocart_products?retryWrites=true&w=majority"
  MONGO_URI_ORDER: "mongodb+srv://<username>:<password>@<cluster>.mongodb.net/novocart_orders?retryWrites=true&w=majority"
  JWT_SECRET: "<generate-a-strong-random-secret>"
