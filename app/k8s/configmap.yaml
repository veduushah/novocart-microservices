apiVersion: v1
kind: ConfigMap
metadata:
  name: novocart-config
  namespace: novocart
data:
  # MongoDB Configuration (non-sensitive — credentials live in novocart-secrets)
  MONGO_HOST: "your-cluster.mongodb.net"
  MONGO_PORT: "27017"
  MONGO_AUTH_SOURCE: "admin"

  # Database Names
  AUTH_DB: "novocart_auth"
  PRODUCT_DB: "novocart_products"
  ORDER_DB: "novocart_orders"

  # Service Ports
  AUTH_PORT: "8081"
  PRODUCT_PORT: "8082"
  ORDER_PORT: "8083"

  # Environment
  SPRING_PROFILES_ACTIVE: "production"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_NOVOCART: "DEBUG"
